[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
csv = "1"
rand = "0.8"
ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg"] }
clap = { version = "4", features = ["derive"] }
tch = "0.26"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

